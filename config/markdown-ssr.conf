server {
    listen 80;
    server_name shushu.host;

    location / {
        return 301 https://$host$request_uri;
    }

    location ~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }
}

server {
    listen 443 ssl http2;
    server_name shushu.host;

    ssl_certificate /root/markdown-ssr-service/certs/shushu.host_bundle.crt;
    ssl_certificate_key /root/markdown-ssr-service/certs/shushu.host.key;

    access_log /var/log/nginx/markdown-ssr.access.log;
    error_log /var/log/nginx/markdown-ssr.error.log;
    
    # 静态站点
    location /changtu/ {
        alias /var/www/changtu/;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location = /changtu {
        return 301 $scheme://$host/changtu/;
    }

    location /renxing/ {
        alias /var/www/renxing/;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location = /renxing {
        return 301 $scheme://$host/renxing/;
    }

    location /englishLessons/ {
        alias /var/www/englishLessons/;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    location = /englishLessons {
        return 301 $scheme://$host/englishLessons/;
    }

    # 剑来光阴 - 小程序H5
    location = /jianlai {
        return 301 $scheme://$host/jianlai/;
    }
    location /jianlai/ {
        alias /var/www/jianlai/;
        index index.html;
        try_files $uri $uri/ /jianlai/index.html;
    }

    # 剑来 API 服务 (新增)
    location /jianlai/api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # Insurance MCP Server (新增)
    # New Insurance Website
    # Health Check Endpoint
    location /health.json {
        alias /var/www/health/status.json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /insurance {
        return 301 $scheme://$host/insurance/;
    }
    location /insurance/ {
        alias /var/www/mcp-website/;
        index index.html;
        try_files $uri $uri/ /insurance/index.html;
    }
    location /insurance/api/ {
        rewrite ^/insurance/api/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Markdown SSR 服务
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
